services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devdesk
      POSTGRES_PASSWORD: devdesk
      POSTGRES_DB: devdesk
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devdesk']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
