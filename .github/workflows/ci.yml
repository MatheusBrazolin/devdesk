name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migrations:
    # Aplica as migrações num Postgres de verdade: pega SQL que o drizzle-kit
    # gerou mas o banco não aceita.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devdesk
          POSTGRES_PASSWORD: devdesk
          POSTGRES_DB: devdesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devdesk"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://devdesk:devdesk@localhost:5432/devdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w @devdesk/api
      - name: Schema e migrações estão em dia
        run: |
          npm run db:generate -w @devdesk/api
          git diff --exit-code -- apps/api/drizzle
