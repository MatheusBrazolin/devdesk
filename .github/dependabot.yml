# Atualizações de dependências toda semana, agrupadas para não virar uma
# enxurrada de PRs. Majors vêm à parte: costumam pedir ajuste no código.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencias]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
